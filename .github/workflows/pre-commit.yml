name: Pre-commit

# Runs the same hooks as a local commit, with the pre-commit version pinned in .tool-versions.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Fails by design on a push to main.
      SKIP: no-commit-to-branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: versions
        name: Read pre-commit version
        run: |
          version="$(awk '$1 == "pre-commit" { print $2 }' .tool-versions)"
          if [[ -z "${version}" ]]; then
            echo "::error::pre-commit is not pinned in .tool-versions"
            exit 1
          fi
          echo "pre_commit=${version}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install pre-commit
        env:
          PRE_COMMIT_VERSION: ${{ steps.versions.outputs.pre_commit }}
        run: |
          python -m pip install --disable-pip-version-check "pre-commit==${PRE_COMMIT_VERSION}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          # The hooks' virtualenvs link to the interpreter, so a new Python on the runner needs a new cache.
          key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        env:
          # Lets zizmor's online audits read the repositories behind every uses without hitting the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pre-commit run --all-files --show-diff-on-failure --color=always
